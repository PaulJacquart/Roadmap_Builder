<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- PhD Roadmap Builder: standalone and offline. Double-click to open in Chrome, Edge, Firefox or Safari. Nothing to install. -->
<title>PhD Roadmap Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
</head>
<body>
<style>
/* Layout: toolbar on top; left rail = libraries + file; right = zoomable timeline board (groups of rows around a CSI axis) + yearly counters; editors float over the board. */
:root{
  --bg:#F5F6FB; --surface:#FFFFFF; --sunken:#EEF0F8; --fg:#1F2033; --muted:#5D6180; --line:#DCDFEE;
  --axis:#F2B8B5; --accent:#4F5FD6; --accent-fg:#FFFFFF; --danger:#C2413B; --today:#E0663F; --ok:#2E8B57;
  --font-d:'Raleway', 'Segoe UI', system-ui, sans-serif;
  --font-b:'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
  --radius:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#13141D; --surface:#1C1E2B; --sunken:#242738; --fg:#ECEDF7; --muted:#A6AAC6; --line:#34374B;
  --axis:#7D4F55; --accent:#97A3FF; --accent-fg:#13141D; --danger:#FF8A80; --today:#FF9466; --ok:#6FD39A; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#13141D; --surface:#1C1E2B; --sunken:#242738; --fg:#ECEDF7; --muted:#A6AAC6; --line:#34374B;
  --axis:#7D4F55; --accent:#97A3FF; --accent-fg:#13141D; --danger:#FF8A80; --today:#FF9466; --ok:#6FD39A; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--font-b);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}

.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.brand{min-width:0;flex:1 1 320px}
.brand input#docTitle{font:800 30px/1.1 var(--font-d);border:0;background:transparent;width:100%;padding:2px 0;border-bottom:1.5px dashed transparent}
.brand input#docTitle:hover,.brand input#docTitle:focus{border-bottom-color:var(--line);outline:none}
.subrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:6px;color:var(--muted)}
.startpick{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;color:var(--fg);font-weight:600;font-size:14px;cursor:pointer}
.startpick svg{width:16px;height:16px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.startpick input{border:0;background:var(--sunken);border-radius:999px;padding:4px 10px;font-size:14px;color:var(--fg)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.field select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:14px;color:var(--fg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
#undo svg,#redo svg{width:18px;height:18px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn svg{width:16px;height:16px}

.main{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}.side{order:2}}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.panel h2{font:700 15px/1.2 var(--font-d);margin:0 0 4px}
.panel .hint{margin:0 0 10px;color:var(--muted);font-size:13px}
.lib-group{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;text-align:left;border:1px solid var(--line);background:var(--sunken);border-radius:999px;padding:4px 10px 4px 4px;font-size:13px;user-select:none;touch-action:none}
.chip:hover{border-color:var(--muted)}
.chip .ic{width:22px;height:22px}
.chip .ic svg{width:13px;height:13px}
.custom{margin-top:12px;width:100%;justify-content:center}
.ic{flex:none;display:inline-grid;place-items:center;border-radius:50%;background:var(--c,#9AA0B5);color:#1F2033}
.ic svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* board toolbar */
.board{min-width:0}
.boardbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:8px}
.zoom{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 12px;font-size:13px;color:var(--muted)}
.zoom b{color:var(--fg);font-weight:600}
.zoom button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--sunken);display:grid;place-items:center;padding:0;font-weight:700;color:var(--fg)}
.zoom input[type=range]{width:110px;accent-color:var(--accent)}
.scale{font-size:12px;color:var(--muted)}

/* board */
.scroll{overflow:auto;max-height:78vh;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);position:relative}
.frame{position:relative;padding:14px 72px 10px 56px}
.gutter{position:absolute;left:0;top:14px;width:52px;bottom:10px}
.gcol{position:absolute;left:4px;width:46px;display:flex;flex-direction:column;align-items:center;gap:2px;overflow:hidden;padding:4px 0}
.garrows{display:flex;flex-direction:column;gap:2px}
.garrows button{width:24px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--fg)}
.garrows button svg{width:14px;height:14px}
.garrows button:hover:not(:disabled){background:var(--fg);color:var(--bg)}
.glabel{flex:1;min-height:0;width:26px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:2px 0;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.glabel span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:100%}
.glabel:hover,.glabel.sel{color:var(--fg);background:var(--sunken)}
.track{position:relative}
.gband{position:absolute;left:-6px;right:-6px;background:var(--sunken);opacity:.55;border-radius:8px;pointer-events:none}
.vline{position:absolute;width:0;border-left:1px solid var(--line);pointer-events:none}
.vline.minor{opacity:.5}
.vline.year{border-left:2px dashed var(--muted);opacity:.55}
.lane{position:absolute;left:0;right:0;border-top:1px dashed var(--line);pointer-events:none}
.ypill{position:absolute;transform:translateX(-50%);font:700 15px/1 var(--font-d);padding:8px 16px;border-radius:999px;color:#1F2033;white-space:nowrap;top:0}
.axisbar{position:absolute;left:-10px;right:-30px;height:8px;border-radius:4px;background:var(--axis)}
.axisbar::after{content:"";position:absolute;right:-12px;top:-6px;border-left:14px solid var(--fg);border-top:10px solid transparent;border-bottom:10px solid transparent}
.ydot{position:absolute;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--surface);pointer-events:none}
.csi{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:ew-resize;touch-action:none;user-select:none;z-index:3}
.csi::before{content:"";width:2px;height:12px;background:var(--fg);margin-top:-14px}
.csi b{font:700 12px/1 var(--font-b);padding:5px 10px;border:1.5px solid var(--fg);border-radius:999px;background:var(--surface);white-space:nowrap}
.csi small{font-size:10.5px;color:var(--muted);white-space:nowrap;background:var(--surface);border-radius:4px;padding:0 3px}
.csi:hover b,.csi.dragging b{background:var(--fg);color:var(--bg)}
.today{position:absolute;top:28px;border-left:2px solid var(--today);pointer-events:none;z-index:2}
.today span{position:absolute;top:-4px;left:4px;font-size:11px;font-weight:700;color:var(--today);white-space:nowrap}
.ruler span{position:absolute;transform:translateX(-50%);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ruler span.major{color:var(--fg);font-weight:600}

.blk{position:absolute;display:flex;align-items:center;gap:7px;padding:0 8px 0 4px;border-radius:999px;border:1.5px solid var(--c);cursor:grab;touch-action:none;user-select:none;min-width:0;z-index:1}
.blk .tx{min-width:0;font-size:13px;line-height:1.15;font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;hyphens:auto;overflow-wrap:break-word}
.blk .ic{width:var(--ic,30px);height:var(--ic,30px)}
.blk .ic svg{width:55%;height:55%}
.blk.short{padding:0 4px}
.blk.short .tx{display:block;white-space:nowrap;text-overflow:clip}
.blk.tiny{padding:0 2px}
.blk.tiny .ic{display:none}
.blk .h{position:absolute;top:3px;bottom:3px;width:10px;cursor:ew-resize;z-index:2}
.blk .h.l{left:-5px}.blk .h.r{right:-5px}
.blk .h::after{content:"";position:absolute;left:3px;top:25%;bottom:25%;width:4px;border-radius:2px;background:var(--c);opacity:0}
.blk:hover .h::after,.blk.sel .h::after{opacity:1}
.blk.sel{box-shadow:0 0 0 2px var(--fg);z-index:4}
.blk.dragging{cursor:grabbing;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.blk.ms{border:0;background:transparent!important;padding:0;gap:6px}
.blk.ms .ic{width:var(--d);height:var(--d);box-shadow:0 0 0 2px var(--surface)}
.blk.ms .tx{white-space:nowrap;display:block}
.blk.ms.sel{box-shadow:none}.blk.ms.sel .ic{box-shadow:0 0 0 2px var(--fg)}
.blk.ms.flip{flex-direction:row-reverse}
.blk.sub{gap:5px;border-width:1.25px}
.blk .fold{flex:none;margin-left:auto;display:inline-flex;align-items:center;gap:1px;border:0;background:rgba(255,255,255,.75);color:#1F2033;border-radius:999px;font-size:11px;font-weight:700;padding:1px 6px 1px 3px;cursor:pointer;line-height:1.2}
.blk .fold svg{width:12px;height:12px}
.blk .fold:hover{background:#1F2033;color:#fff}
.blk.tiny .fold{display:none}
.dlgbg{position:fixed;inset:0;z-index:45;background:rgba(20,22,40,.35);display:grid;place-items:center;padding:16px}
.pop.dlg{position:relative;top:auto;left:auto;width:min(440px,100%);max-height:calc(100vh - 32px);overflow:auto}
.dlg .check{margin-top:8px}
.dlg .custom-box{margin:6px 0 4px 26px}
.blk.sub .tx{font-size:11.5px;font-weight:600;display:block;white-space:nowrap;text-overflow:clip}
.emptymsg{position:absolute;left:50%;transform:translate(-50%,-50%);max-width:90%;text-align:center;color:var(--muted);font-size:15px;pointer-events:none;background:var(--surface);border:1px dashed var(--line);border-radius:999px;padding:8px 18px}

/* counters */
.counters{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.ct-head{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.ct-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ct{background:var(--sunken);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:12px;border:2px solid transparent}
.ct.sel{border-color:var(--fg)}
.ct-top{display:flex;gap:10px;align-items:center;cursor:pointer;border-radius:8px;min-width:0;border:0;background:transparent;padding:0;text-align:left}
.ct-top .ic{width:42px;height:42px;--c:#C9CCDD}
.ct-top .ic svg{width:20px;height:20px}
.ct-top b{display:block;font:700 15px/1.15 var(--font-d);overflow-wrap:anywhere}
.ct-top small{display:block;color:var(--muted);font-size:13px}
.ct-top small em{font-style:normal;color:var(--fg);font-weight:600}
.ct-boxes{display:flex;gap:6px}
.ct-box{position:relative;flex:1;min-width:0;height:60px;border:2px solid var(--c);border-radius:9px;background:var(--surface);display:flex}
.ct-box.done{box-shadow:inset 0 0 0 1px var(--c)}
.ct-box .yl{position:absolute;left:5px;top:3px;font-size:9.5px;color:var(--muted);pointer-events:none}
.ct-box .ok{position:absolute;right:21px;top:2px;color:var(--ok);font-size:11px;font-weight:700;pointer-events:none}
.ct-box input{flex:1;min-width:0;border:0;background:transparent;text-align:center;font-weight:700;font-size:16px;padding:6px 0 14px;font-variant-numeric:tabular-nums;border-radius:7px 0 0 7px}
.ct-box .gl{position:absolute;left:0;right:18px;bottom:8px;text-align:center;font-size:10px;color:var(--muted);pointer-events:none;font-variant-numeric:tabular-nums}
.ct-box .bar{position:absolute;left:4px;right:22px;bottom:4px;height:3px;background:var(--line);border-radius:2px;overflow:hidden;pointer-events:none}
.ct-box .bar i{display:block;height:100%;background:var(--c)}
.stp{display:flex;flex-direction:column;width:18px;border-left:1px solid var(--line)}
.stp button{flex:1;border:0;background:transparent;padding:0;display:grid;place-items:center;color:var(--muted)}
.stp button:hover{background:var(--sunken);color:var(--fg)}
.stp button svg{width:12px;height:12px}
.ct-empty{color:var(--muted);font-size:14px;margin:0}

/* floating editor */
.pop{position:fixed;z-index:40;width:min(350px,calc(100vw - 20px));max-height:calc(100vh - 20px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(20,22,40,.22);padding:14px}
.pop-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.pop-h h2{font:700 15px/1.2 var(--font-d);margin:0}
.pop-x{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--sunken);display:grid;place-items:center;padding:0}
.pop .l{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.pop input[type=text],.pop input[type=number],.pop input[type=date],.pop select,.dlg input[type=number],.dlg input[type=date],.dlg select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:14px;color:var(--fg)}
.pop .hint{color:var(--muted);font-size:12.5px;margin:6px 0 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rowN{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px}
.icons{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:118px;overflow:auto;padding:2px}
.icons button{aspect-ratio:1;border:1px solid transparent;background:var(--sunken);border-radius:8px;display:grid;place-items:center;padding:0}
.icons button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icons button[aria-pressed="true"]{border-color:var(--fg);background:var(--surface)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches button{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.swatches .auto{background:conic-gradient(#8E9CF6 0 33%,#6FD3E0 0 66%,#A9D46F 0);}
.check{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}
.ed-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--sunken);font-weight:700}
.stepper output{min-width:28px;text-align:center;font-weight:700}

.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.9}
.foot{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:13px;margin-top:8px}
.foot b{color:var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:60}
@media (prefers-reduced-motion:no-preference){.blk{transition:box-shadow .15s}}
</style>

<div class="bar">
  <div class="brand">
    <input id="docTitle" aria-label="Title" maxlength="80">
    <div class="subrow">
      <label class="startpick" for="startDate"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg><span data-i="start"></span><input id="startDate" type="date"></label>
      <span id="subtitle"></span>
    </div>
  </div>
  <div class="controls">
    <div class="seg" role="group" aria-label="History"><button id="undo" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button><button id="redo" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button></div>
    <div class="seg" role="group" aria-label="Language"><button id="lang-en" type="button">EN</button><button id="lang-fr" type="button">FR</button></div>
    <label class="field"><span data-i="duration"></span><select id="duration"><option value="36"></option><option value="48"></option></select></label>
    <button class="btn danger" id="empty" type="button"></button>
    <button class="btn primary" id="expPptx" type="button"></button>
    <button class="btn primary" id="expPdf" type="button"></button>
  </div>
</div>

<div class="main">
  <aside class="side">
    <section class="panel">
      <h2 data-i="library"></h2>
      <p class="hint" data-i="libHint"></p>
      <div id="library"></div>
      <button class="btn custom" id="addCustom" type="button"></button>
    </section>
    <section class="panel">
      <h2 data-i="counters"></h2>
      <p class="hint" data-i="ctHint"></p>
      <div class="chips" id="ctLibrary"></div>
      <button class="btn custom" id="addCounter" type="button"></button>
    </section>
    <section class="panel">
      <h2 data-i="file"></h2>
      <p class="hint" data-i="fileHint"></p>
      <div class="ed-actions" style="margin-top:0">
        <button class="btn" id="saveJson" type="button"></button>
        <label class="btn" for="openJson" id="openLbl"></label><input id="openJson" type="file" accept=".json,application/json" hidden>
        <button class="btn" id="reset" type="button"></button>
      </div>
    </section>
  </aside>
  <section class="board">
    <div class="boardbar">
      <div class="zoom"><b data-i="zoomH"></b><button id="zxOut" type="button" aria-label="−">−</button><input id="zx" type="range" min="0" max="100" step="1"><button id="zxIn" type="button" aria-label="+">+</button><span class="scale" id="scaleLbl"></span></div>
      <div class="zoom"><b data-i="zoomV"></b><button id="zyOut" type="button" aria-label="−">−</button><input id="zy" type="range" min="36" max="110" step="2"><button id="zyIn" type="button" aria-label="+">+</button></div>
      <button class="btn sm" id="fit" type="button"></button>
      <button class="btn sm" id="addGroup" type="button"></button>
      <button class="btn sm" id="foldAll" type="button"></button>
    </div>
    <div class="scroll" id="scroll"><div class="frame" id="frame"><div class="gutter" id="gutter"></div><div class="track" id="track"></div></div></div>
    <div class="counters" id="counters"></div>
    <div class="foot" id="foot"></div>
  </section>
</div>
<div class="pop" id="pop" role="dialog" hidden></div>
<div class="dlgbg" id="expDlg" hidden><div class="pop dlg" role="dialog" aria-modal="true" aria-labelledby="expTitle">
  <div class="pop-h"><h2 id="expTitle" data-i="exportT"></h2><button type="button" class="pop-x" id="expX"></button></div>
  <span class="l" data-i="expFmt"></span>

  if(!(o.v>=3)){
    o.groups = defaultGroups();
    o.blocks = o.blocks.map(b=>{ const s=+b.start||0, d=+b.dur||0, lane=+b.lane||0;
      const n = {...b, start:md(s), dur: d ? md(s+d)-md(s) : 0, g: lane<4 ? 'gS' : 'gR', row: lane<4 ? lane : lane-4}; delete n.lane; return n });
    if(typeof o.startDate==='string' && /^\d{4}-\d{2}$/.test(o.startDate)) o.startDate += '-01';
    o.v = 3;
  }
  o.months = o.months===48 ? 48 : 36;
  if(!Array.isArray(o.groups) || !o.groups.length) o.groups = defaultGroups();
  o.groups.forEach(g=>{ g.rows = clamp(Math.round(+g.rows||2),1,8); if(!g.id) g.id=uid() });
  if(!Array.isArray(o.csi)) o.csi = defaultCsi(o.months);
  if(!Array.isArray(o.counters)) o.counters = defaultCounters();
  o.counters.forEach(c=>{ if(!Array.isArray(c.values)) c.values=['','','','']; if(!Array.isArray(c.goals)) c.goals=['','','',''] });
  if(typeof o.startDate!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(o.startDate)) o.startDate='';
  const gmap = Object.fromEntries(o.groups.map(g=>[g.id,g]));
  o.blocks.forEach(b=>{ if(!gmap[b.g]) b.g = o.groups[0].id; b.row = clamp(Math.round(+b.row||0), 0, gmap[b.g].rows-1); b.start=Math.round(+b.start||0); b.dur=Math.round(+b.dur||0) });
  return {...defaults(), ...o};
}

let L = null;

const subVisible = s => !EXP_NOSUBS && !(parentOf(s)?.folded);

function rowLanes(g,row){
  if(!st.blocks.some(b=>b.sub && b.g===g && b.row===row && subVisible(b))) return 0;
  return clamp(Math.max(1, ...st.blocks.filter(b=>!b.sub && !b.folded && b.g===g && b.row===row).map(b=>b.subLanes||1)), 1, MAXLANES);

const rowWeight = (g,row) => { const n = rowLanes(g,row); return n ? 1 + SUBW*(n-1) : 1 };
function groupGeom(g, R, y0){ const rt=[], rh=[]; let y=y0; for(let r=0;r<g.rows;r++){ rt.push(y); rh.push(R*rowWeight(g.id,r)); y+=rh[r] } return {top:y0, h:y-y0, rt, rh} }
// sub-area geometry of a row: base row height R, padding pad
function subGeom(g,row,R,pad){
  const lanes = rowLanes(g,row), rowH = R*(lanes ? 1+SUBW*(lanes-1) : 1), mainH = (R-2*pad)*SPLIT, gap = Math.min(4, R*0.06);
  const area = rowH - 2*pad - mainH - gap, laneH = lanes ? (area - gap*(lanes-1))/lanes : 0;

}
function layout(){
  const ROW = view.zy, gl = {}; let y = G.YR, axisTop = null;
  st.groups.forEach((g,i)=>{ gl[g.id] = {...groupGeom(g, ROW, y), i}; y += gl[g.id].h; if(i===0){ axisTop = y; y += G.AX } });
  if(axisTop===null){ axisTop = y; y += G.AX }
  const fit = Math.max(900, $('scroll').clientWidth - PADL - PADR - 2);

}
const px = d => d*L.ppd;
// vertical box of a block inside its row (offset from row top, height), for base row height R and padding pad
function vbox(b, R, pad){
  const q = subGeom(b.g, b.row, R, pad);
  if(!q.lanes) return [pad, R-2*pad];
  if(!b.sub) return [pad, q.mainH];
  const ln = clamp(b.lane||0, 0, q.lanes-1);
  return [q.top0 + ln*(q.laneH+q.gap), q.laneH];
}
const rowTop = (g,row) => L.gl[g].rt[row];
function laneFromLocalY(g,row,local){ const q = subGeom(g,row,L.ROW,5); return q.lanes ? clamp(Math.floor((local-q.top0)/(q.laneH+q.gap)), 0, q.lanes-1) : 0 }

  if(y < L.gl[gs[0].id].top) return {g:gs[0].id, row:0};
  if(y >= L.axisTop && y < L.axisTop+G.AX){ if(y < L.axisTop+G.AX/2 || gs.length<2) return {g:gs[0].id, row:gs[0].rows-1}; return {g:gs[1].id, row:0} }

}

function ticks(){
  const Dd = D(), M = st.months, p = L.ppd, mW = p*MD, wW = p*7, out = {lines:[], labels:[]};
  if(wW < 28){                                   // month view: labels every 3 months until they fit, then every month
    const lineStep = mW < 14 ? 3 : 1, labStep = mW < 56 ? 3 : 1;
    for(let m=lineStep;m<M;m+=lineStep) if(m%12) out.lines.push({d:md(m)});
    for(let m=0;m<=M;m+=labStep) out.labels.push({d:md(m), t:monthLabel(m), major:m%12===0});
  } else {
    for(let m=1;m<M;m++) if(m%12) out.lines.push({d:md(m)});
    const daily = p >= 28;
    for(let d=daily?1:7; d<Dd; d+=daily?1:7) out.lines.push({d, minor:true});
    if(daily) for(let d=0; d<=Dd; d+=(st.startDate || p>=44) ? 1 : 7){ const dt = st.startDate ? dayToDate(d) : null;
      out.labels.push({d, t: dt ? (dt.getDate()===1 ? fmtDay(d,{day:'numeric',month:'short'}) : String(dt.getDate())) : T('dy')(d+1), major: dt ? dt.getDate()===1 : d%7===0}) }
    else { const step = wW < 56 ? 14 : 7;              // every 2 weeks until they fit, then every week
      for(let d=0; d<=Dd; d+=step) out.labels.push({d, t: st.startDate ? fmtDay(d,{day:'numeric',month:'short'}) : T('wk')(d/7+1), major:false}) }
  }
  return out;
}

/* ---------- zoom ---------- */

/* ---------- floating editor ---------- */

const unitDays = u => u==='d' ? 1 : u==='w' ? 7 : MD;
function anchorEl(){

      <span class="l">${esc(T('icon'))}</span>${icGrid('data-cicon', c.icon)}
      <div class="ed-actions"><button class="btn" type="button" id="edCL" ${i===0?'disabled':''}>← ${esc(T('mvL'))}</button><button class="btn" type="button" id="edCR" ${i===st.counters.length-1?'disabled':''}>${esc(T('mvR'))} →</button><button class="btn danger" type="button" id="edCDel">${esc(T('del'))}</button></div>`;
  } else {
    const i = st.groups.indexOf(g);
    p.innerHTML = popHead(T('gEdit')) +
      `<label class="l" for="edGName">${esc(T('gName'))}</label><input type="text" id="edGName" maxlength="40" value="${esc(groupName(g))}">
      <span class="l">${esc(T('gRows'))}</span><div class="stepper"><button type="button" id="edGRm" ${g.rows<=1?'disabled':''} aria-label="−">−</button><output>${g.rows}</output><button type="button" id="edGRp" ${g.rows>=8?'disabled':''} aria-label="+">+</button></div>

function closeAll(){ sel=null; csel=null; gsel=null; renderEditor(); markSel() }
function markSel(){
  $('track').querySelectorAll('.blk').forEach(el=>el.classList.toggle('sel', el.dataset.id===sel));
  $('counters').querySelectorAll('.ct').forEach(el=>el.classList.toggle('sel', el.dataset.cid===csel));
  $('gutter').querySelectorAll('.glabel').forEach(el=>el.classList.toggle('sel', el.dataset.gid===gsel));
}
function select(id){ sel=id; csel=null; gsel=null; markSel(); renderEditor() }
function selectCounter(id){ csel=id; sel=null; gsel=null; markSel(); renderEditor() }
function selectGroup(id){ gsel=id; sel=null; csel=null; markSel(); renderEditor() }

const pop = $('pop');
pop.addEventListener('input', e=>{
  const t = e.target, id = t.id;
  const b = st.blocks.find(x=>x.id===sel), c = st.counters.find(x=>x.id===csel), g = st.groups.find(x=>x.id===gsel);
  if(b){
    const ud = unitDays(view.unit);
    if(id==='edLabel'){ b.text = t.value; refreshBlock(b) }
    else if(id==='edS' && t.value!==''){ b.start = Math.round(num(t.value)*ud); fix(b); refreshBlock(b) }
    else if(id==='edL' && t.value!=='' && b.dur){ b.dur = Math.max(1, Math.round(num(t.value)*ud)); fix(b); refreshBlock(b) }
    else return;
    save(); placePop();
  } else if(c){
    if(id==='edCTitle') c.title = t.value; else if(id==='edCUnit') c.unit = t.value;
    else if(t.dataset.goal!==undefined) c.goals[+t.dataset.goal] = t.value; else return;
    save(); renderCounters();
  } else if(g){
    if(id==='edGName'){ g.name = t.value; save(); renderBoard() }
  }
});
pop.addEventListener('change', e=>{
  const t = e.target, id = t.id, b = st.blocks.find(x=>x.id===sel);
  if(b){
    if(id==='edMs'){ b.dur = t.checked ? 0 : Math.min(md(1), D()-b.start) || 1; fix(b); refreshBlock(b) }
    else if(id==='edSub'){ b.sub = t.checked || undefined; renderBoard() }
    else if(id==='edFold'){ b.folded = t.checked || undefined; renderBoard() }
    else if(id==='edU'){ view.unit = t.value; saveView() }
    else if(id==='edSD' && t.value){ const keep=b.dur; b.start = dayOfIso(t.value); b.dur = keep; fix(b); refreshBlock(b) }
    else if(id==='edED' && t.value){ b.dur = Math.max(1, dayOfIso(t.value) - b.start + 1); fix(b); refreshBlock(b) }
    else if(id==='edG'){ b.g = t.value; b.row = findRow(b.g, b.start, b.dur, 0, b); fix(b); renderBoard() }
    commit(); if(/^(edMs|edSub|edFold|edU|edSD|edED|edG|edS|edL)$/.test(id)) renderEditor(); return;
  }
  commit();
});
pop.addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  if(btn.id==='popClose'){ closeAll(); return }
  const b = st.blocks.find(x=>x.id===sel), c = st.counters.find(x=>x.id===csel), g = st.groups.find(x=>x.id===gsel);
  if(b){
    if(btn.dataset.icon) b.icon = btn.dataset.icon;
    else if(btn.dataset.color) b.color = btn.dataset.color;
    else if(btn.id==='edDel'){ st.blocks = st.blocks.filter(x=>x!==b); sel=null; commit(); renderBoard(); renderEditor(); return }
    else if(btn.id==='edLvM' || btn.id==='edLvP'){
      b.subLanes = clamp((b.subLanes||1) + (btn.id==='edLvP'?1:-1), 1, MAXLANES);
      const n = Math.max(1, rowLanes(b.g,b.row) || b.subLanes);
      st.blocks.forEach(x=>{ if(x.sub && x.g===b.g && x.row===b.row && (x.lane||0)>=n) x.lane = n-1 });
      commit(); renderBoard(); renderEditor(); return }
    else if(btn.id==='edLnM' || btn.id==='edLnP'){
      b.lane = clamp((b.lane||0) + (btn.id==='edLnP'?1:-1), 0, Math.max(1,rowLanes(b.g,b.row))-1);
      commit(); renderBoard(); renderEditor(); return }
    else if(btn.id==='edAddSub'){
      // fill the stacked levels evenly: put the new sub-block where a level ends earliest within this category
      const lanes = clamp(b.subLanes||1, 1, MAXLANES), end = b.start + Math.max(b.dur,1);
      let best = {lane:0, s:b.start}, bestS = Infinity;
      for(let ln=0; ln<lanes; ln++){
        const subs = st.blocks.filter(x=>x.sub && x.g===b.g && x.row===b.row && (x.lane||0)===ln && x.start>=b.start && x.start<end);
        const s1 = subs.length ? Math.max(...subs.map(x=>x.start+x.dur)) : b.start;
        if(s1 < bestS){ bestS = s1; best = {lane:ln, s:s1} }
      }
      const n = {id:uid(), key:null, icon:b.icon, start: best.s < end ? best.s : b.start, dur: Math.max(1, Math.min(md(1), b.dur || md(1))), g:b.g, row:b.row, color:b.color, text:T('newSub'), sub:true, lane:best.lane};
      fix(n); st.blocks.push(n); sel=n.id; commit(); renderBoard(); renderEditor(true); return }
    else if(btn.id==='edDup'){ const n={...b, id:uid()}; n.row = findRow(n.g, n.start, n.dur, b.row, undefined, n.sub); st.blocks.push(n); sel=n.id; commit(); renderBoard(); renderEditor(); return }
    else return;
    commit(); refreshBlock(b); renderEditor();
  } else if(c){
    const i = st.counters.indexOf(c);
    if(btn.dataset.cicon) c.icon = btn.dataset.cicon;
    else if(btn.id==='edCL' && i>0) st.counters.splice(i-1,0,st.counters.splice(i,1)[0]);
    else if(btn.id==='edCR' && i<st.counters.length-1) st.counters.splice(i+1,0,st.counters.splice(i,1)[0]);
    else if(btn.id==='edCDel'){ st.counters.splice(i,1); csel=null }
    else return;
    commit(); renderCounters(); renderEditor();
  } else if(g){
    const i = st.groups.indexOf(g);
    if(btn.id==='edGRm' || btn.id==='edGRp'){ g.rows = clamp(g.rows + (btn.id==='edGRp'?1:-1), 1, 8); st.blocks.forEach(fix) }
    else if(btn.id==='edGU') moveGroup(g.id,-1);
    else if(btn.id==='edGD') moveGroup(g.id,1);
    else if(btn.id==='edGDel' && st.groups.length>1){ st.groups.splice(i,1); st.blocks = st.blocks.filter(x=>x.g!==g.id); gsel=null }
    else return;
    commit(); renderBoard(); renderEditor();
  }
});
document.addEventListener('pointerdown', e=>{
  if(pop.hidden || pop.contains(e.target)) return;
  if(e.target.closest('.blk,.ct-top,.ct,.glabel,.garrows,.csi')) return;
  closeAll();
}, true);
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !pop.hidden){ closeAll() } });

/* ---------- groups ---------- */
function moveGroup(id, dir){
  const i = st.groups.findIndex(g=>g.id===id), j = i+dir; if(i<0 || j<0 || j>=st.groups.length) return;
  st.groups.splice(j,0,st.groups.splice(i,1)[0]);
}
$('gutter').addEventListener('click', e=>{
  const up = e.target.closest('[data-gup]'), dn = e.target.closest('[data-gdown]'), lb = e.target.closest('[data-gid]');
  if(up){ moveGroup(up.dataset.gup,-1); commit(); renderBoard(); renderEditor() }
  else if(dn){ moveGroup(dn.dataset.gdown,1); commit(); renderBoard(); renderEditor() }
  else if(lb) selectGroup(lb.dataset.gid);
});
$('addGroup').onclick = ()=>{ const g = {id:uid(), key:null, name:T('newGroup'), rows:2}; st.groups.push(g); commit(); renderBoard(); selectGroup(g.id); renderEditor(true) };

/* ---------- placement ---------- */
function free(g,row,s,d,ignore,sub,lane){ const e = s+Math.max(d,1); return !st.blocks.some(b=>b!==ignore && !!b.sub===!!sub && (!sub || (b.lane||0)===(lane||0)) && b.g===g && b.row===row && b.start < e && s < b.start+Math.max(b.dur,1)) }
function findRow(g,s,d,prefer=0,ignore,sub){
  const gr = st.groups.find(x=>x.id===g); if(!gr) return 0;
  const rows = [...Array(gr.rows).keys()].sort((x,y)=>Math.abs(x-prefer)-Math.abs(y-prefer));
  return rows.find(r=>free(g,r,s,d,ignore,sub,0)) ?? clamp(prefer,0,gr.rows-1);
}
const groupFor = p => (p && p.side==='b' ? st.groups.find(g=>g.key==='R') : st.groups.find(g=>g.key==='S')) || st.groups[0];
function visibleDay(){ const sc=$('scroll'); return clamp(Math.round((sc.scrollLeft + sc.clientWidth/2 - PADL)/L.ppd), 0, D()) }
function addBlock(key, at){
  const p = key ? PM[key] : null;
  let start = at ? at.start : p ? md(p.start) : snapAbs(visibleDay());
  const dur = p ? (p.dur ? md(p.start+p.dur)-md(p.start) : 0) : md(1);
  const g = at ? at.g : groupFor(p).id;
  const b = {id:uid(), key:key||null, icon: p ? p.icon : 'star', start, dur, g, row:0, color:'auto', text: p ? null : T('newBlock')};
  fix(b); b.row = at ? at.row : findRow(g, b.start, b.dur); fix(b);
  st.blocks.push(b); commit(); renderBoard();
  if(p) markSel(); else { select(b.id); renderEditor(true) }
  const el = $('track').querySelector(`[data-id="${b.id}"]`);
  if(el){ const sc=$('scroll'); const x = px(b.start)+PADL; if(x < sc.scrollLeft || x > sc.scrollLeft+sc.clientWidth-80) sc.scrollLeft = Math.max(0, x-sc.clientWidth/3) }
}
$('addCustom').onclick = () => addBlock(null);
$('foldAll').onclick = ()=>{ const mains = st.blocks.filter(m=>!m.sub && subsOf(m).length), open = mains.some(m=>!m.folded);
  mains.forEach(m=>{ m.folded = open || undefined }); if(open && sel && st.blocks.find(x=>x.id===sel)?.sub) sel=null; commit(); renderBoard(); renderEditor() };

/* ---------- drag on board (blocks + CSI) ---------- */
let drag = null;
const tr = $('track');
tr.addEventListener('pointerdown', e=>{
  const fb = e.target.closest('.fold');
  if(fb){ e.preventDefault(); e.stopPropagation(); const m = st.blocks.find(x=>x.id===fb.dataset.fold); if(m){ m.folded = !m.folded || undefined; commit(); renderBoard(); renderEditor() } return }
  const cs = e.target.closest('.csi');
  if(cs){ const c = st.csi.find(x=>x.id===cs.dataset.csi); if(!c) return;
    drag = {csi:c, x0:e.clientX, y0:e.clientY, orig:c.day, moved:false}; cs.classList.add('dragging'); tr.setPointerCapture(e.pointerId); e.preventDefault(); return }
  const el = e.target.closest('.blk');
  if(!el){ closeAll(); return }

  const mode = e.target.classList.contains('l') ? 'l' : e.target.classList.contains('r') ? 'r' : 'move';

tr.addEventListener('keydown', e=>{
  const b = st.blocks.find(x=>x.id===sel); if(!b) return;
  if(e.key==='Enter'){ renderEditor(true); return }
  const step = stepDays(); let used = true;
  const slots = st.groups.flatMap(g=>[...Array(g.rows).keys()].map(r=>[g.id,r]));
  const si = slots.findIndex(([g,r])=>g===b.g && r===b.row);
  if(e.key==='ArrowRight'){ if(e.shiftKey && b.dur) b.dur += step; else b.start += step }

      sl.addShape(pres.shapes.LINE, {x:p.x1, y:p.y1, w:Math.max(p.x2-p.x1,0), h:Math.max(p.y2-p.y1,0), line:{color:h(p.c), width:p.w, dashType:p.dash?'dash':'solid'}});
    } else if(p.t==='tri'){
      sl.addShape(pres.shapes.ISOSCELES_TRIANGLE, {x:p.x-p.s/2, y:p.y-p.s/2, w:p.s, h:p.s, rotate:90, fill:{color:h(p.f)}, line:{type:'none'}});
    } else if(p.t==='img'){
      sl.addImage({data:await iconPng(p.icon), x:p.x, y:p.y, w:p.w, h:p.h});
    } else if(p.t==='text'){
      const o = {fontSize:p.s, bold:!!p.b, color:h(p.c), align:p.al||'center', valign:'middle', margin:0, fontFace:'Calibri', isTextBox:true};
      if(p.clip){ const per = Math.max(1, Math.floor(p.w/(p.s/72*0.52))), max = per*(p.ml||1); if(p.text.length > max) p = {...p, text:p.text.slice(0,max).trimEnd()}; if((p.ml||1)===1) o.wrap = false }
      if(p.rot) sl.addText(p.text, {...o, x:p.x+p.w/2-p.h/2, y:p.y+p.h/2-p.w/2, w:p.h, h:p.w, rotate:270, align:'center'});
      else sl.addText(p.text, {...o, x:p.x, y:p.y, w:p.w, h:p.h});
    }
  }
  const blob = await pres.write({outputType:'blob'});
  await offer(fileBase()+'.pptx', blob);
}
async function exportPdf(opt){
  toast(T('building'));
  await loadLib('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js', ()=>window.jspdf);
  const doc = new jspdf.jsPDF({orientation:'landscape', unit:'in', format:'a3'});
  const rgb = c => { const n=parseInt(c.slice(1),16); return [n>>16,(n>>8)&255,n&255] };
  const mix = (c,a) => rgb(c).map(v=>Math.round(v*a+255*(1-a)));
  const dash = on => doc.setLineDashPattern(on?[0.07,0.055]:[],0);
  for(const p of model(opt)){
    dash(false);
    if(p.t==='rect'){
      doc.setFillColor(...(p.fa?mix(p.f,p.fa):rgb(p.f)));
      if(p.st){ doc.setDrawColor(...rgb(p.st)); doc.setLineWidth(p.sw/72) }
      doc.roundedRect(p.x,p.y,p.w,p.h,p.r,p.r, p.st?'FD':'F');
      if(p.text){ doc.setFont('helvetica','bold'); doc.setFontSize(p.s); doc.setTextColor(...rgb(p.tc)); doc.text(p.text, p.x+p.w/2, p.y+p.h/2, {align:'center', baseline:'middle'}) }
    } else if(p.t==='oval'){
      doc.setFillColor(...rgb(p.f)); if(p.st){ doc.setDrawColor(...rgb(p.st)); doc.setLineWidth(p.sw/72) }
      doc.ellipse(p.x+p.w/2, p.y+p.h/2, p.w/2, p.h/2, p.st?'FD':'F');
    } else if(p.t==='line'){
      doc.setDrawColor(...rgb(p.c)); doc.setLineWidth(p.w/72); dash(p.dash); doc.line(p.x1,p.y1,p.x2,p.y2);
    } else if(p.t==='tri'){
      doc.setFillColor(...rgb(p.f)); doc.triangle(p.x-p.s/2,p.y-p.s/2, p.x-p.s/2,p.y+p.s/2, p.x+p.s/2,p.y, 'F');
    } else if(p.t==='img'){
      doc.addImage(await iconPng(p.icon), 'PNG', p.x, p.y, p.w, p.h);
    } else if(p.t==='text'){
      doc.setFont('helvetica', p.b?'bold':'normal'); doc.setFontSize(p.s); doc.setTextColor(...rgb(p.c));
      if(p.rot){ const tw = Math.min(doc.getTextWidth(p.text), p.h); doc.text(p.text, p.x+p.w/2+p.s/72*0.35, p.y+p.h/2+tw/2, {angle:90}); continue }
      let lines;
      if(p.clip && (p.ml||1)===1){ let t = p.text; while(t.length && doc.getTextWidth(t) > p.w) t = t.slice(0,-1); lines = t ? [t.trimEnd()] : [] }
      else lines = doc.splitTextToSize(p.text, p.w).slice(0, p.ml||2);
      const lh = p.s/72*1.2;
      let y = p.y + p.h/2 - (lines.length-1)*lh/2;
      const x = p.al==='center' ? p.x+p.w/2 : p.al==='right' ? p.x+p.w : p.x;
      for(const ln of lines){ doc.text(ln, x, y, {align:p.al||'left', baseline:'middle'}); y += lh }
    }
  }
  await offer(fileBase()+'.pdf', doc.output('blob'));
}
/* ---------- export dialog ---------- */
view.exp = Object.assign({fmt:'pdf', win:'all', subs:true, ct:true, from:null, to:null}, view.exp||{});
const visibleRange = () => { const sc=$('scroll'); return [clamp(Math.round((sc.scrollLeft-PADL)/L.ppd),0,D()), clamp(Math.round((sc.scrollLeft+sc.clientWidth-PADL)/L.ppd),0,D())] };
function openExport(fmt){
  const E = view.exp, Dd = D(), [v0,v1] = visibleRange();
  if(fmt) E.fmt = fmt;
  if(E.from===null || E.to===null || E.to>Dd){ E.from = v0; E.to = v1 }
  $('expX').innerHTML = UI.x; $('expX').setAttribute('aria-label', T('close'));
  document.querySelectorAll('#expDlg [data-fmt]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.fmt===E.fmt));
  $('expAllLbl').textContent = `${T('expAll')} (${T(st.months===48?'d48':'d36')})`;
  $('expViewLbl').textContent = `${T('expView')} (${rangeLabel(v0,v1)})`;
  document.querySelectorAll('#expDlg [name=expWin]').forEach(r=>r.checked = r.value===E.win);
  const ud = unitDays(view.unit);
  $('expCustomBox').innerHTML = st.startDate
    ? `<div class="row2"><div><label class="l" for="expFrom">${esc(T('expFrom'))}</label><input type="date" id="expFrom" min="${isoOfDay(0)}" max="${isoOfDay(Dd)}" value="${isoOfDay(E.from)}"></div><div><label class="l" for="expTo">${esc(T('expTo'))}</label><input type="date" id="expTo" min="${isoOfDay(0)}" max="${isoOfDay(Dd)}" value="${isoOfDay(E.to)}"></div></div>`
    : `<div class="row2" style="grid-template-columns:1fr 1fr 1fr"><div><label class="l" for="expFrom">${esc(T('expFrom'))}</label><input type="number" id="expFrom" min="0" step="any" value="${fmtNum(E.from/ud)}"></div><div><label class="l" for="expTo">${esc(T('expTo'))}</label><input type="number" id="expTo" min="0" step="any" value="${fmtNum(E.to/ud)}"></div><div><label class="l" for="expU">${esc(T('unit'))}</label><select id="expU">${['d','w','m'].map(k=>`<option value="${k}" ${k===view.unit?'selected':''}>${esc(T(k==='d'?'uD':k==='w'?'uW':'uM'))}</option>`).join('')}</select></div></div><p class="hint">${esc(T('fromStart'))}</p>`;
  $('expSubs').checked = E.subs; $('expCt').checked = E.ct;
  $('expGo').textContent = T('expGo'); $('expCancel').textContent = T('cancel');
  $('expDlg').hidden = false; $('expGo').focus();
}
function readCustom(){
  const E = view.exp, f = $('expFrom'), t = $('expTo'); if(!f || !t) return;
  if(st.startDate){ if(f.value) E.from = dayOfIso(f.value); if(t.value) E.to = dayOfIso(t.value) }
  else { const ud = unitDays(view.unit); if(f.value!=='') E.from = Math.round(num(f.value)*ud); if(t.value!=='') E.to = Math.round(num(t.value)*ud) }
  E.from = clamp(E.from, 0, D()); E.to = clamp(E.to, 0, D());
}
const closeExport = () => { $('expDlg').hidden = true };
$('expDlg').addEventListener('click', e=>{
  const fb = e.target.closest('[data-fmt]'); if(fb){ view.exp.fmt = fb.dataset.fmt; document.querySelectorAll('#expDlg [data-fmt]').forEach(b=>b.setAttribute('aria-pressed', b===fb)); saveView(); return }
  if(e.target.id==='expDlg' || e.target.closest('#expX') || e.target.id==='expCancel') closeExport();
});
$('expDlg').addEventListener('change', e=>{
  const E = view.exp, t = e.target;
  if(t.name==='expWin') E.win = t.value;
  else if(t.id==='expSubs') E.subs = t.checked;
  else if(t.id==='expCt') E.ct = t.checked;
  else if(t.id==='expU'){ readCustom(); view.unit = t.value; saveView(); openExport(); $('expDlg').querySelector('[value=custom]').checked = true; E.win='custom'; return }
  else if(t.id==='expFrom' || t.id==='expTo'){ readCustom(); E.win = 'custom'; $('expDlg').querySelector('[value=custom]').checked = true }
  saveView();
});
$('expGo').onclick = ()=>{
  const E = view.exp; readCustom();
  let w0 = 0, w1 = D();
  if(E.win==='view') [w0,w1] = visibleRange();
  else if(E.win==='custom'){ w0 = Math.min(E.from,E.to); w1 = Math.max(E.from,E.to) }
  if(w1-w0 < 7){ toast(T('expShort')); return }
  saveView(); closeExport();
  const opt = {w0, w1, subs:E.subs, ct:E.ct};
  (E.fmt==='pptx' ? exportPptx(opt) : exportPdf(opt)).catch(err=>toast(String(err?.message||err)));
};
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('expDlg').hidden) closeExport() });
$('expPptx').onclick = ()=>openExport('pptx');
$('expPdf').onclick = ()=>openExport('pdf');

/* ---------- undo / redo ---------- */
const snap = () => JSON.stringify({...st, lang:undefined});
let hist=[], fut=[], last=snap();
function updHist(){ $('undo').disabled = !hist.length && snap()===last; $('redo').disabled = !fut.length }
function commit(){ const s=snap(); save(); if(s===last){ updHist(); return } hist.push(last); if(hist.length>150) hist.shift(); fut=[]; last=s; updHist() }
function restore(s){ const l=st.lang; st=JSON.parse(s); st.lang=l; last=s;
  if(sel && !st.blocks.some(b=>b.id===sel)) sel=null; if(csel && !st.counters.some(c=>c.id===csel)) csel=null; if(gsel && !st.groups.some(g=>g.id===gsel)) gsel=null; save(); renderAll() }
function undo(){ commit(); if(!hist.length) return; fut.push(last); restore(hist.pop()) }
function redo(){ if(!fut.length) return; hist.push(last); restore(fut.pop()) }
$('undo').onclick = undo; $('redo').onclick = redo;
document.addEventListener('keydown', e=>{
  if(!(e.ctrlKey||e.metaKey) || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const k=e.key.toLowerCase();
  if(k==='z' && !e.shiftKey){ e.preventDefault(); undo() }
  else if(k==='y' || (k==='z' && e.shiftKey)){ e.preventDefault(); redo() }
});

/* ---------- yearly counters ---------- */
function renderCounters(){
  const yrs = st.months/12, el = $('counters');
  el.innerHTML = `<div class="ct-head">${esc(T('countHead'))}</div>` + (st.counters.length ? `<div class="ct-grid">` + st.counters.map(c=>{
    const tot = c.values.slice(0,yrs).reduce((a,v)=>a+num(v),0), tgoal = c.goals.slice(0,yrs).reduce((a,v)=>a+num(v),0);
    return `<div class="ct${c.id===csel?' sel':''}" data-cid="${c.id}">
    <button type="button" class="ct-top" aria-label="${esc(T('ctEdit'))}: ${esc(ctTitle(c))}"><span class="ic">${svg(c.icon)}</span><div style="min-width:0"><b>${esc(ctTitle(c))}</b><small>${esc(ctUnit(c))}${tgoal?` · ${esc(T('total'))} <em>${fmtNum(tot)}/${fmtNum(tgoal)}</em>`:''}</small></div></button>
    <div class="ct-boxes">${Array.from({length:yrs},(_,y)=>{ const v=c.values[y]??'', g=num(c.goals[y]), pct = g ? clamp(num(v)/g,0,1)*100 : 0, done = g && num(v)>=g;
      return `<div class="ct-box${done?' done':''}" style="--c:${YEARC[y]}"><span class="yl">${T('yShort')}${y+1}</span>${done?'<span class="ok">✓</span>':''}<input id="ct-${c.id}-${y}" data-y="${y}" inputmode="decimal" maxlength="7" autocomplete="off" value="${esc(v)}" aria-label="${esc(ctTitle(c))} ${T('yShort')}${y+1}">${g?`<span class="gl">/ ${fmtNum(g)}</span><span class="bar"><i style="width:${pct}%"></i></span>`:''}<span class="stp"><button type="button" data-step="1" data-y="${y}" aria-label="+1">${UI.cup}</button><button type="button" data-step="-1" data-y="${y}" aria-label="−1">${UI.cdown}</button></span></div>` }).join('')}</div>
  </div>` }).join('') + `</div>` : `<p class="ct-empty">${esc(T('ctEmpty'))}</p>`);
}
$('counters').addEventListener('click', e=>{
  const stp = e.target.closest('[data-step]');
  if(stp){ const c = st.counters.find(x=>x.id===stp.closest('.ct').dataset.cid), y = +stp.dataset.y;
    c.values[y] = fmtNum(Math.max(0, num(c.values[y]) + +stp.dataset.step)); commit(); renderCounters();
    $('counters').querySelector(`[data-cid="${c.id}"] [data-step="${stp.dataset.step}"][data-y="${y}"]`)?.focus(); return }
  const t = e.target.closest('.ct-top'); if(t) selectCounter(t.closest('.ct').dataset.cid);
});
$('counters').addEventListener('input', e=>{ const i=e.target; if(i.tagName!=='INPUT') return; const c=st.counters.find(x=>x.id===i.closest('.ct').dataset.cid); c.values[+i.dataset.y]=i.value; save() });
$('counters').addEventListener('change', ()=>{ commit(); renderCounters() });
$('counters').addEventListener('keydown', e=>{ const i=e.target; if(i.tagName!=='INPUT' || (e.key!=='ArrowUp' && e.key!=='ArrowDown')) return; e.preventDefault();
  const c=st.counters.find(x=>x.id===i.closest('.ct').dataset.cid), y=+i.dataset.y; c.values[y]=fmtNum(Math.max(0, num(c.values[y])+(e.key==='ArrowUp'?1:-1))); commit(); renderCounters(); $(`ct-${c.id}-${y}`)?.focus() });
$('ctLibrary').addEventListener('click', e=>{ const ch=e.target.closest('[data-ckey]'); if(!ch) return; const c=newCounter(ch.dataset.ckey); st.counters.push(c); commit(); renderCounters(); $('counters').querySelector(`[data-cid="${c.id}"]`)?.scrollIntoView({block:'nearest',behavior:'smooth'}) });
$('addCounter').onclick = ()=>{ const c=newCounter(null); c.title=T('newCt'); c.unit=T('newUnit'); st.counters.push(c); commit(); renderCounters(); $('counters').querySelector(`[data-cid="${c.id}"]`)?.scrollIntoView({block:'nearest'}); selectCounter(c.id); renderEditor(true) };

function renderAll(){ renderChrome(); renderBoard(); renderCounters(); renderEditor(); updHist() }
renderAll();
